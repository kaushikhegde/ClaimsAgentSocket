# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ClaimAgentSocket

on:
  push:
    branches:
      - main
    # Monorepo: only redeploy the backend when backend code changes.
    paths:
      - 'backend/**'
      - '.github/workflows/main_claimagentsocket.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present
          # Tests are integration tests (need a live Postgres DB + API keys) and
          # cannot run on the build runner, so they are not part of the deploy.

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78000D5EC5E14F2498A53DCDF2DDA520 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_289B910376D54D709ECD2FAB2673C09F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3BD2BDD34B3A486B9BFA53196E532D09 }}

      - name: Set Azure Web App settings (from GitHub secrets)
        uses: azure/appservice-settings@v1
        with:
          app-name: 'ClaimAgentSocket'
          slot-name: 'Production'
          app-settings-json: |
            [
              { "name": "NODE_ENV",          "value": "production" },
              { "name": "DATABASE_SSL",      "value": "true" },
              { "name": "GEMINI_LIVE_MODEL", "value": "models/gemini-2.5-flash-native-audio-latest" },
              { "name": "GEMINI_TEXT_MODEL", "value": "gemini-2.5-flash" },
              { "name": "GEMINI_API_KEY",    "value": "${{ secrets.GEMINI_API_KEY }}" },
              { "name": "DATABASE_URL",      "value": "${{ secrets.DATABASE_URL }}" },
              { "name": "STORAGE_NAME",      "value": "${{ secrets.STORAGE_NAME }}" },
              { "name": "CONTAINER_NAME",    "value": "${{ secrets.CONTAINER_NAME }}" },
              { "name": "TENANT_ID",         "value": "${{ secrets.STORAGE_TENANT_ID }}" },
              { "name": "CLIENT_ID",         "value": "${{ secrets.STORAGE_CLIENT_ID }}" },
              { "name": "CLIENT_SECRET",     "value": "${{ secrets.STORAGE_CLIENT_SECRET }}" }
            ]

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ClaimAgentSocket'
          slot-name: 'Production'
          package: .
          